[package]
name = "zcode-model-sync"
version = "3.2.0"
description = "ZCode Model Manager - Rust & Tauri v2 Edition with Cloud Sync"
authors = ["ZCode Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
walkdir = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
